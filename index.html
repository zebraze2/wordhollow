<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Wordhollow</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world"></canvas>
  <div id="hud" hidden>
    <button id="region-chip" title="This land's spelling lesson"></button>
    <div class="hud-right">
      <button class="hbtn" id="btn-map"></button>
      <button class="hbtn" id="btn-book"></button>
      <button class="hbtn" id="btn-bag"></button>
      <button class="hbtn icon" id="btn-sound"></button>
    </div>
  </div>
  <button id="prompt" hidden></button>
  <div id="ui"></div>

  <script src="js/words.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/pix.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script>
    Save.load();
    Game.init();
    UI.init();
    UI.title();
  </script>
</body>
</html>
