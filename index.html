<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Explorer Spell</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world"></canvas>
  <div id="hud" hidden>
    <button id="region-chip" title="This land's spelling lesson"></button>
    <div class="hud-right">
      <button class="hbtn" id="btn-map"></button>
      <button class="hbtn" id="btn-book"></button>
      <button class="hbtn" id="btn-bag"></button>
      <button class="hbtn icon" id="btn-sound"></button>
    </div>
  </div>
  <button id="prompt" hidden></button>
  <div id="ui"></div>

  <script>
    /* The game moved from zebraze2.github.io to bregan.org/explore/. A browser keeps each site's
       saves separate, so the old address forwards players and carries their progress along. */
    (function () {
      const KEY = 'wordhollow.v1', HOME = 'https://bregan.org/explore/';
      const enc = s => btoa(unescape(encodeURIComponent(s))), dec = s => decodeURIComponent(escape(atob(s)));
      if (location.hostname.endsWith('github.io')) {
        let save = null; try { save = localStorage.getItem(KEY); } catch {}
        location.replace(HOME + (save ? '#import=' + encodeURIComponent(enc(save)) : ''));
        throw new Error('moved'); // stop here; the page is leaving
      }
      const m = location.hash.match(/^#import=(.+)$/);
      if (!m) return;
      try {
        const incoming = JSON.parse(dec(decodeURIComponent(m[1])));
        const here = JSON.parse(localStorage.getItem(KEY) || 'null');
        // keep whichever save has more play in it, so a second visit never wipes newer progress
        const score = d => !d ? -1 : Object.keys(d.done || {}).length * 1e4 + Object.values(d.words || {}).reduce((n, w) => n + (w.right || 0) + (w.wrong || 0), 0);
        if (score(incoming) > score(here)) localStorage.setItem(KEY, JSON.stringify(incoming));
      } catch {}
      history.replaceState(null, '', location.pathname);
    })();
  </script>
  <script src="js/words.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/pix.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script>
    Save.load();
    Game.init();
    UI.init();
    UI.title();
  </script>
</body>
</html>
